AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - node_modules/**/*
    - vendor/**/*
    - test/dummy/tmp/**/*
    - test/dummy/public/assets/**/*
Metrics:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Layout/LineLength:
  Max: 160
Naming/FileName:
  Exclude:
    - lib/blobatar-rails.rb
