name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ruby:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        rails: [rails71, rails72, rails80, rails81]
        pipeline: [propshaft, sprockets]
        ruby: ['3.4']
        include:
          - rails: rails71
            pipeline: sprockets
            ruby: '3.1'
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.rails }}.gemfile
      ASSET_PIPELINE: ${{ matrix.pipeline }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          rubygems: '3.6.9'
          bundler: '2.6.9'
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec ruby bin/rails assets:precompile
        working-directory: test/dummy
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: '1'
          BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.rails }}.gemfile
      - run: gem build blobatar-rails.gemspec
  browser:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        pipeline: [propshaft, sprockets]
    env:
      ASSET_PIPELINE: ${{ matrix.pipeline }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          rubygems: '3.6.9'
          bundler: '2.6.9'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: bundle exec rubocop
      - run: npm run vendor && git diff --exit-code -- app/javascript/blobatar/vendor vendor app/assets/stylesheets/blobatar.css
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-${{ matrix.pipeline }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  demo-arm64:
    runs-on: ubuntu-24.04-arm
    container: ruby:3.4-bookworm
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/test/dummy/Gemfile
      BUNDLE_FROZEN: 'true'
      BUNDLE_WITHOUT: development:test
      RAILS_ENV: production
      APP_URL: https://demo.laravel.cloud
    steps:
      - uses: actions/checkout@v4
      - name: Install the frozen ARM64 production bundle
        run: |
          gem update --system 3.6.9 --no-document
          gem install bundler -v 2.6.9 --no-document
          bundle _2.6.9_ install
      - run: bundle exec ruby bin/rails assets:precompile
        working-directory: test/dummy
        env:
          SECRET_KEY_BASE_DUMMY: '1'
      - name: Render every expression with Ruby
        working-directory: test/dummy
        env:
          SECRET_KEY_BASE_DUMMY: '1'
        run: |
          bundle exec ruby -r ./config/environment <<'RUBY'
          Blobatar::Rails::Options::EXPRESSIONS.each do |expression|
            svg = Blobatar::Rails::Renderer.svg("cloud-arm64", {}, expression: expression)
            abort "SVG missing: #{expression}" unless svg.include?("<svg")
          end
          puts "ARM64 production Ruby renderer passed all expressions"
          RUBY
  demo:
    runs-on: ubuntu-22.04
    env:
      BUNDLE_GEMFILE: test/dummy/Gemfile
      BUNDLE_FROZEN: 'true'
      RAILS_ENV: production
      APP_URL: https://demo.laravel.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          rubygems: '3.6.9'
          bundler: '2.6.9'
          bundler-cache: true
      - run: bundle exec ruby bin/rails assets:precompile
        working-directory: test/dummy
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/test/dummy/Gemfile
          SECRET_KEY_BASE_DUMMY: '1'
      - name: Serve production SSR and all importmap assets over IPv6
        working-directory: test/dummy
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/test/dummy/Gemfile
        run: |
          export SECRET_KEY_BASE="$(openssl rand -hex 64)"
          bundle exec ruby bin/rails server -b :: -p 3000 > "$RUNNER_TEMP/demo.log" 2>&1 &
          server=$!
          trap 'kill "$server"; cat "$RUNNER_TEMP/demo.log"' EXIT
          curl --noproxy '*' --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 'http://[::1]:3000/up'
          bundle exec ruby -rnet/http -rjson -rnokogiri <<'RUBY'
          http = Net::HTTP.new("::1", 3000, nil)
          get = lambda do |path|
            response = http.get(path, "Host" => "demo.laravel.cloud", "X-Forwarded-Proto" => "https")
            abort "#{path}: #{response.code}" unless response.is_a?(Net::HTTPSuccess)
            response.body
          end
          page = Nokogiri::HTML(get.call("/"))
          abort "Landing SSR preview missing" unless page.at_css("#studio-preview svg")
          abort "Hotwire SSR avatars missing" unless Nokogiri::HTML(get.call("/hotwire")).css("svg").length >= 40
          abort "Editor SSR preview missing" unless Nokogiri::HTML(get.call("/editor")).at_css("#studio-preview svg")
          abort "Component examples missing" unless Nokogiri::HTML(get.call("/components")).css(".showcase-section").length == 5
          imports = JSON.parse(page.at_css('script[type="importmap"]').text).fetch("imports")
          paths = imports.values + page.css('link[rel="stylesheet"]').map { |link| link["href"] }
          paths.each { |path| abort "Nonlocal asset: #{path}" unless path.start_with?("/assets/"); get.call(path) }
          puts "Production SSR and #{paths.length} local assets passed"
          RUBY
